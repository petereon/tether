name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # lets publish.yml reuse this instead of duplicating it

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run ruff format --check .
