name: Publish to PyPI

# Fires on a GitHub Release being published, not on every tag push - lets a
# release be drafted/reviewed before anything actually gets uploaded to
# PyPI. Requires the PYPI_API_TOKEN repo secret (Settings > Secrets and
# variables > Actions) - a PyPI API token scoped to this project. `uv
# publish` reads it via UV_PUBLISH_TOKEN (CLAUDE.md: uv for build and
# distribution, never raw pip/twine).
on:
  release:
    types: [published]

jobs:
  # There's no unpublishing from PyPI - lint and the full test suite gate
  # the publish job below rather than trusting that whatever's tagged for
  # release already passed CI earlier. Reuses lint.yml/test.yml (each
  # triggers on `workflow_call` for exactly this) instead of duplicating
  # their steps here.
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - run: uv build

      - run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
