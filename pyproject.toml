[project]
name = "tether-mcu"
version = "0.1.1"
description = "Call MicroPython functions from Python and back, over serial, wifi, or BLE, from a single file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "msgpack>=1.0",
    # Not just a dev/lint tool here - slicer/__init__.py invokes the `ruff`
    # CLI as a subprocess at connect()-time (post-slice unused-import
    # stripping, see DESIGN.md § Dependencies and CHUNKS.md chunk 14). Any
    # code path that slices (serial's connect()) needs it installed.
    "ruff>=0.6",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
ble = ["bleak>=0.21"]
cli = ["click>=8.1", "beaupy>=3.0", "pyserial>=3.5"]
dev = ["pytest>=8.0"]

[project.scripts]
tether = "tether.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tether", "src/tether_runtime"]

[tool.ruff]
line-length = 100
# Vendored third-party code (see src/tether_runtime/umsgpack/VENDORED.md) -
# kept byte-for-byte diffable against upstream, not reformatted to our style.
extend-exclude = ["src/tether_runtime/umsgpack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
