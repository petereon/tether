[project]
name = "tether"
version = "0.1.0"
description = "Call MicroPython functions from Python and back, over serial, wifi, or BLE, from a single file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "msgpack>=1.0",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
ble = ["bleak>=0.21"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tether", "src/tether_runtime"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
